<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙游戏‑登录</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui}
        html,body {
            background:#000;
            min-height:100vh;
        }
        /* 登录遮罩容器，全屏黑色背景，中间白色登录卡片 */
        #loginWrap{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:16px;
        }
        .login-box{
            width:100%;
            max-width:420px;
            background:#ffffff;
            color:#000000;
            border-radius:14px;
            padding:32px 24px;
            border:1px solid #cccccc;
            box-shadow: 0 0 25px #222;
        }
        .login-box h2{
            text-align:center;
            margin-bottom:28px;
            font-size:24px;
            color:#000;
        }
        .tip {color:#555; margin:10px 0;font-size:14px}
        .error {color:#dc2626}
        input {
            width:100%;
            padding:12px 14px;
            margin:8px 0;
            border-radius:8px;
            border:1px solid #bbb;
            background:#f7f7f7;
            color:#000;
            font-size:16px;
        }
        button {
            width:100%;
            padding:12px;
            margin:8px 0;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:#fff;
            font-size:16px;
        }
        button:disabled {background:#888;opacity:0.7;cursor:not-allowed;}
        button.danger {background:#b91c1c}
        button.gold {background:#d97706}
        .hide{display:none !important;}
    </style>
</head>
<body>
    <div id="loginWrap">
        <div class="login-box">
            <h2>修仙游戏</h2>
            <input id="uname" placeholder="用户名">
            <input id="pwd" type="password" placeholder="密码">
            <div class="tip" id="authTip"></div>
            <button id="btnRegister">注册账号</button>
            <button id="btnLogin">登录账号</button>
        </div>
    </div>
<script>
const SUPABASE_URL = "https://akbkupgqscgzokwjnllr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rnKCzXAh4OL1DIDIrTUf4A_JLnjfbWr";

const unameEl = document.getElementById('uname');
const pwdEl = document.getElementById('pwd');
const authTip = document.getElementById('authTip');

let isLoading = false;

// 注册
document.getElementById("btnRegister").onclick = async function(){
    if(isLoading){authTip.innerText="正在注册，请稍候...";return;}
    const username = unameEl.value.trim();
    const password = pwdEl.value.trim();
    if(!username||!password){authTip.innerText="请填写用户名密码";return;}
    isLoading = true;
    authTip.innerText="正在注册中...";
    authTip.classList.remove("error");
    this.disabled = true;
    try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/accounts`,{
            method:"POST",
            headers:{
                "apikey":SUPABASE_ANON_KEY,
                "Content‑Type":"application/json",
                "Prefer":"return=representation"
            },
            body:JSON.stringify([{username,password}])
        });
        const data = await res.json();
        if(res.ok){
            authTip.innerText="注册成功，请登录";
        }else{
            authTip.innerText="注册失败："+JSON.stringify(data);
            authTip.classList.add("error");
        }
    }catch(err){
        authTip.innerText="网络异常，请检查网络";
        authTip.classList.add("error");
        console.error(err);
    }finally{
        isLoading = false;
        this.disabled = false;
    }
}

// 登录：登录成功跳转game.html
document.getElementById("btnLogin").onclick = async function(){
    if(isLoading){authTip.innerText="正在登录，请稍候...";return;}
    const username = unameEl.value.trim();
    const password = pwdEl.value.trim();
    if(!username||!password){authTip.innerText="请填写用户名密码";return;}
    isLoading = true;
    authTip.innerText="正在登录中...";
    authTip.classList.remove("error");
    this.disabled = true;
    try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/accounts?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}`,{
            method:"GET",
            headers:{"apikey":SUPABASE_ANON_KEY}
        });
        const arr = await res.json();
        if(arr.length===0){
            authTip.innerText="用户名或密码错误";
            authTip.classList.add("error");
            return;
        }
        const user = arr[0];
        sessionStorage.setItem("game_user_id", user.id);
        // 跳转到游戏页面
        location.href = "game.html";
    }catch(err){
        authTip.innerText="网络异常，请检查网络";
        authTip.classList.add("error");
        console.error("登录网络错误：",err);
    }finally{
        isLoading = false;
        this.disabled = false;
    }
}
</script>
</body>
</html>
