<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>修仙游戏</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    background:#000000;
    width:100%;
    height:100%;
    overflow:hidden;
}
.splash-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    width:100%;
}
.logo{
    width: min(75vw,320px);
    height:auto;
}
.tip{
    color:#aaaaaa;
    margin-top:28px;
    font-size:15px;
}
.jump-btn{
    margin-top:40px;
    padding:12px 30px;
    background:#222;
    color:#fff;
    border:1px solid #555;
    border-radius:8px;
    font-size:16px;
    /* 默认隐藏，超时才显示 */
    display:none;
}
</style>
</head>
<body>
<div class="splash-wrap">
    <img class="logo" src="https://cdn.harmony5.cn/square/5c5a222b-2dd3-4ef0-8c7c-bdd10afce405.jpg" alt="游戏logo">
    <div class="tip">正在启动游戏...</div>
    <button id="manualBtn" class="jump-btn" onclick="goLogin()">点击进入游戏</button>
</div>
<script>
// 填入你的github pages完整域名
const BASE_URL = "https://raynaldogomez37-droid.github.io";
const loginPage = BASE_URL + "/login.html";

let timer = setTimeout(function(){
    goLogin();
},5000);

// 8秒后自动把手动按钮显示出来，定时器卡死的时候给用户入口
let showBtnTimer = setTimeout(function(){
    document.getElementById('manualBtn').style.display = 'inline-block';
},8000);

function goLogin(){
    clearTimeout(timer);
    clearTimeout(showBtnTimer);
    // 使用绝对完整地址跳转，解决安卓相对路径死循环
    window.location.href = loginPage;
}

window.onbeforeunload=()=>{
    clearTimeout(timer);
    clearTimeout(showBtnTimer);
};
</script>
</body>
</html>
