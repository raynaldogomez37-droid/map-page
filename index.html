<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>修仙游戏</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    background:#000000;
    width:100%;
    height:100%;
    overflow:hidden;
}
/*绝对定位，百分百兼容安卓手机浏览器*/
.splash-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    width:100%;
}
.logo{
    width: min(75vw,320px);
    height:auto;
}
.tip{
    color:#aaaaaa;
    margin-top:28px;
    font-size:15px;
}
.jump-btn{
    margin-top:40px;
    padding:12px 30px;
    background:#222;
    color:#fff;
    border:1px solid #555;
    border-radius:8px;
    font-size:16px;
}
</style>
</head>
<body>
<div class="splash-wrap">
    <img class="logo" src="https://cdn.harmony5.cn/square/5c5a222b-2dd3-4ef0-8c7c-bdd10afce405.jpg" alt="游戏logo">
    <div class="tip">正在启动游戏...</div>
    <!--兜底按钮，如果定时器卡死，玩家手动点击进入登录页-->
    <button class="jump-btn" onclick="location.href='login.html'">点击进入游戏</button>
</div>
<script>
//5秒自动跳转
let timer = setTimeout(function(){
    location.href="login.html";
},5000);
//页面销毁清除定时器，防止内存异常
window.onbeforeunload=()=>clearTimeout(timer);
</script>
</body>
</html>
