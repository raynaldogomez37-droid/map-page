<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>打字修仙</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    background:#000000;
    width:100%;
    height:100%;
    font-family:system-ui,-apple-system,Segoe UI;
}
.hide-view{display:none !important;}

/* -------- 启动闪屏 -------- */
#viewSplash{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background:#050508;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}
.splash-inner{
    text-align:center;
    width:100%;
}
.logo{
    width: min(70vw, 300px);
    height:auto;
}
.tip-splash{
    color:#b4b8c3;
    margin-top:32px;
    font-size:16px;
}
.btn-manual{
    margin-top:48px;
    padding:14px 36px;
    background:#1b2b48;
    color:#e2e8f0;
    border:1px solid #475569;
    border-radius:12px;
    font-size:16px;
    display:none;
}

/* -------- 登录页面 -------- */
#viewLogin{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 16px;
    background:#0b101b;
}
.login-box{
    width:100%;
    max-width:420px;
    background:#ffffff;
    color:#000000;
    border-radius:18px;
    padding:36px 28px;
    border:1px solid #cbd5e1;
    box-shadow: 0 8px 30px #00000070;
}
.login-box h2{
    text-align:center;
    margin-bottom:32px;
    font-size:26px;
    color:#1e293b;
}
.tip {color:#475569; margin:12px 0;font-size:14px}
.error {color:#dc2626}
input {
    width:100%;
    padding:14px 16px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #94a3b8;
    background:#f8fafc;
    color:#000;
    font-size:16px;
}
button {
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:500;
}
button:disabled {background:#64748b;opacity:0.8;cursor:not-allowed;}
button.danger {background:#b91c1c}
button.gold {background:#ca8a04}

/* -------- 打字游戏主界面 -------- */
#viewGame{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#0b101b;
    color:#e2e8f0;
}
.top-bar{
    padding:14px 12px;
    background:#141c30;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 12px #00000060;
}
#avatarBox{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:17px;
    box-shadow:0 0 10px #3b82f670;
}
.top-middle{
    flex:1;
}
.exp-bg{
    width:100%;
    height:10px;
    background:#1e293b;
    border-radius:6px;
    margin-top:6px;
}
#expBar{
    height:100%;
    background:linear-gradient(90deg,#16a34a,#22c55e);
    width:0%;
    border-radius:6px;
}
.top-right{
    text-align:right;
    font-size:14px;
    line-height:1.5;
}
#settingBtn{
    margin-left:6px;
    padding:6px 10px;
    background:#27344d;
    border:none;
    color:#e2e8f0;
    border-radius:8px;
    width:auto;
}

#gameArea{
    flex:1;
    position:relative;
    background:#0f172a;
    overflow:hidden;
}

#startBtn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:16px 40px;
    font-size:19px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:#fff;
    border:none;
    border-radius:14px;
    box-shadow:0 6px 20px #2563eb50;
    z-index:10;
}

#typingInput{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    width:86%;
    padding:12px 16px;
    font-size:17px;
    border-radius:12px;
    border:none;
    background:#1e293b;
    color:#ffffff;
    z-index:20;
}

.fall-word{
    position:absolute;
    background-color:#1e3a60dd;
    backdrop-filter:blur(4px);
    padding:10px 12px;
    border-radius:10px;
    min-width:110px;
    text-align:center;
    box-shadow:0 4px 14px #00000050;
    border:1px solid #3b82f640;
}
.desc{
    font-size:13px;
    color:#a5b4fc;
    margin-top:6px;
}

.bottom-nav{
    display:flex;
    background:#141c30;
    box-shadow:0 -2px 12px #00000060;
}
.bottom-nav button{
    flex:1;
    padding:16px 0;
    background:none;
    border:none;
    color:#cbd5e1;
    font-size:14px;
}

.panel-wrap{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.88);
    display:none;
    padding:18px 14px;
    z-index:99;
}
.panel-content{
    background:#141c30;
    border-radius:16px;
    padding:18px;
    height:88vh;
    overflow-y:auto;
    box-shadow:0 8px 30px #00000080;
}
.panel-close{
    padding:8px 12px;
    background:#dc2626;
    border:none;
    color:white;
    border-radius:8px;
    margin-bottom:14px;
    width:auto;
}
.item-row{
    padding:12px 8px;
    border-bottom:1px solid #27344d;
    font-size:15px;
}
</style>
</head>
<body>

<div id="viewSplash">
    <div class="splash-inner">
        <img class="logo" src="https://cdn.harmony5.cn/square/5c5a222b-2dd3-4ef0-8c7c-bdd10afce405.jpg" alt="游戏logo">
        <div class="tip-splash">正在启动游戏...</div>
        <button id="btnManual" class="btn-manual">点击进入游戏</button>
    </div>
</div>

<div id="viewLogin" class="hide-view">
    <div class="login-box">
        <h2>打字修仙</h2>
        <input id="uname" placeholder="用户名">
        <input id="pwd" type="password" placeholder="密码">
        <div class="tip" id="authTip"></div>
        <button id="btnRegister">注册账号</button>
        <button id="btnLogin">登录账号</button>
    </div>
</div>

<div id="viewGame" class="hide-view">
    <div class="top-bar">
        <div id="avatarBox">头像</div>
        <div class="top-middle">
            <div>等级:<span id="lvText">1</span></div>
            <div class="exp-bg"><div id="expBar"></div></div>
        </div>
        <div class="top-right">
            <div>攻击:<span id="atkText">2</span></div>
            <div>血量:<span id="hpText">100/100</span></div>
        </div>
        <button id="settingBtn">设置</button>
    </div>

    <div id="gameArea">
        <button id="startBtn">开始训练</button>
        <input id="typingInput" placeholder="在这里输入飘落的英文单词">
    </div>

    <div class="bottom-nav">
        <button id="btnBag">背包</button>
        <button id="btnWare">仓库</button>
        <button id="btnAttr">个人属性</button>
        <button id="btnHome">返回主页</button>
    </div>

    <div class="panel-wrap" id="bagPanel">
        <div class="panel-content">
            <button class="panel-close">关闭</button>
            <h3>背包</h3>
            <div id="bagList"></div>
        </div>
    </div>
    <div class="panel-wrap" id="warePanel">
        <div class="panel-content">
            <button class="panel-close">关闭</button>
            <h3>仓库</h3>
            <div id="wareList"></div>
        </div>
    </div>
    <div class="panel-wrap" id="attrPanel">
        <div class="panel-content">
            <button class="panel-close">关闭</button>
            <h3>个人属性</h3>
            <div id="attrText"></div>
        </div>
    </div>
    <div class="panel-wrap" id="equipPanel">
        <div class="panel-content">
            <button class="panel-close">关闭</button>
            <h3>已穿戴装备</h3>
            <div id="wearList"></div>
        </div>
    </div>
    <div class="panel-wrap" id="settingPanel">
        <div class="panel-content">
            <button class="panel-close">关闭</button>
            <h3>设置</h3>
            <br>
            <button id="logoutBtn">退出账号</button>
        </div>
    </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/view.js"></script>
<script src="./js/login.js"></script>
<script src="./js/gameCore.js"></script>
<script src="./js/draw.js"></script>
<script src="./js/bag.js"></script>
<script src="./js/uiPanel.js"></script>
<script src="./js/typingGame.js"></script>
</body>
</html>
