<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>修仙游戏</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    background:#000000;
    width:100%;
    height:100%;
}
.hide-view{display:none !important;}

/* -------- 启动闪屏 -------- */
#viewSplash{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}
.splash-inner{
    text-align:center;
    width:100%;
}
.logo{
    width: min(75vw,320px);
    height:auto;
}
.tip-splash{
    color:#aaaaaa;
    margin-top:28px;
    font-size:15px;
}
.btn-manual{
    margin-top:40px;
    padding:12px 30px;
    background:#222;
    color:#fff;
    border:1px solid #555;
    border-radius:8px;
    font-size:16px;
    display:none;
}

/* -------- 登录页面 -------- */
#viewLogin{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
}
.login-box{
    width:100%;
    max-width:420px;
    background:#ffffff;
    color:#000000;
    border-radius:14px;
    padding:32px 24px;
    border:1px solid #cccccc;
    box-shadow: 0 0 25px #222222;
}
.login-box h2{
    text-align:center;
    margin-bottom:28px;
    font-size:24px;
    color:#000;
}
.tip {color:#555; margin:10px 0;font-size:14px}
.error {color:#dc2626}
input {
    width:100%;
    padding:12px 14px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #bbb;
    background:#f7f7f7;
    color:#000;
    font-size:16px;
}
button {
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
}
button:disabled {background:#888;opacity:0.7;cursor:not-allowed;}
button.danger {background:#b91c1c}
button.gold {background:#d97706}

/* -------- 游戏页面 -------- */
#viewGame{
    max-width:600px;
    margin:0 auto;
    padding:16px;
}
.box {
    background:#ffffff;
    color:#000000;
    padding:18px;
    border-radius:12px;
    margin-bottom:14px;
    border:1px solid #cccccc;
}
.box h3{
    color:#000;
    margin-bottom:8px;
}
.item-card {
    background:#eeeeee;
    color:#000000;
    padding:10px;
    border-radius:8px;
    margin:8px 0;
}
.rarity-common {border-left:4px solid #777777}
.rarity-rare {border-left:4px solid #4cc9f0}
.rarity-epic {border-left:4px solid #7209b7}
.rarity-legend {border-left:4px solid #f77f00}
</style>
</head>
<body>

<!-- 【1】启动闪屏界面 -->
<div id="viewSplash">
    <div class="splash-inner">
        <img class="logo" src="https://cdn.harmony5.cn/square/5c5a222b-2dd3-4ef0-8c7c-bdd10afce405.jpg" alt="游戏logo">
        <div class="tip-splash">正在启动游戏...</div>
        <button id="btnManual" class="btn-manual">点击进入游戏</button>
    </div>
</div>

<!-- 【2】登录注册界面 -->
<div id="viewLogin" class="hide-view">
    <div class="login-box">
        <h2>修仙游戏</h2>
        <input id="uname" placeholder="用户名">
        <input id="pwd" type="password" placeholder="密码">
        <div class="tip" id="authTip"></div>
        <button id="btnRegister">注册账号</button>
        <button id="btnLogin">登录账号</button>
    </div>
</div>

<!-- 【3】游戏主界面 -->
<div id="viewGame" class="hide-view">
    <div class="box">
        <h3>角色信息</h3>
        <p>角色名：<span id="roleName">-</span></p>
        <p>金币：<span id="goldNum">0</span></p>
        <button class="danger" id="btnLogout">退出登录（切换账号）</button>
    </div>
    <div class="box">
        <h3>秘境抽装备（消耗10金币）</h3>
        <div class="tip" id="drawTip"></div>
        <button class="gold" id="btnDraw">开始抽装备</button>
        <div id="drawResult"></div>
    </div>
    <div class="box">
        <h3>我的背包</h3>
        <div class="tip" id="bagTip"></div>
        <button id="btnLoadBag">刷新背包</button>
        <div id="bagList"></div>
    </div>
</div>

<!-- JS引入顺序严格不能乱！config最先，view其次，业务在后 -->
<script src="./js/config.js"></script>
<script src="./js/view.js"></script>
<script src="./js/login.js"></script>
<script src="./js/gameCore.js"></script>
<script src="./js/draw.js"></script>
<script src="./js/bag.js"></script>

</body>
</html>
