<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字修仙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111827;color:#fff;font-family:system-ui;max-width:100vw;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/*顶部状态栏*/
.top-bar{padding:12px 10px;background:#1f2937;display:flex;align-items:center;gap:8px;}
#avatarBox{width:44px;height:44px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.top-middle{flex:1;}
.exp-bg{width:100%;height:8px;background:#333;border-radius:4px;margin-top:4px;}
#expBar{height:100%;background:#22c55e;width:0%;border-radius:4px;}
.top-right{text-align:right;font-size:14px;}
#settingBtn{margin-left:8px;padding:4px 8px;background:#374151;border:none;color:#fff;border-radius:4px;}

/*游戏中间区域*/
#gameArea{flex:1;position:relative;background:#121a2c;overflow:hidden;}
#startBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 32px;font-size:18px;background:#2563eb;color:#fff;border:none;border-radius:8px;}
#typingInput{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:85%;padding:10px;font-size:16px;border-radius:6px;border:none;display:none;}
.fall-word{position:absolute;background:#1e3a5f;padding:8px 10px;border-radius:6px;min-width:90px;text-align:center;}
.desc{font-size:12px;color:#94a3b8;margin-top:4px;}

/*底部导航*/
.bottom-nav{display:flex;background:#1f2937;}
.bottom-nav button{flex:1;padding:14px 0;background:none;border:none;color:#fff;font-size:14px;}

/*弹窗面板*/
.panel-wrap{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;padding:16px;}
.panel-content{background:#1f2937;border-radius:10px;padding:14px;height:85vh;overflow-y:auto;}
.panel-close{padding:6px 10px;background:#ef4444;border:none;color:white;border-radius:4px;margin-bottom:10px;}
.item-row{padding:10px;border-bottom:1px solid #333;}
</style>
</head>
<body>
<!--顶部-->
<div class="top-bar">
    <div id="avatarBox">头像</div>
    <div class="top-middle">
        <div>等级:<span id="lvText">1</span></div>
        <div class="exp-bg"><div id="expBar"></div></div>
    </div>
    <div class="top-right">
        <div>攻击:<span id="atkText">2</span></div>
        <div>血量:<span id="hpText">100/100</span></div>
    </div>
    <button id="settingBtn">设置</button>
</div>

<!--游戏区-->
<div id="gameArea">
    <button id="startBtn">开始训练</button>
    <input id="typingInput" placeholder="输入飘落的英文单词">
</div>

<!--底部导航-->
<div class="bottom-nav">
    <button id="btnBag">背包</button>
    <button id="btnWare">仓库</button>
    <button id="btnAttr">个人属性</button>
    <button id="btnHome">返回主页</button>
</div>

<!--弹窗 -->
<div class="panel-wrap" id="bagPanel">
    <div class="panel-content">
        <button class="panel-close">关闭</button>
        <h3>背包</h3>
        <div id="bagList"></div>
    </div>
</div>

<div class="panel-wrap" id="warePanel">
    <div class="panel-content">
        <button class="panel-close">关闭</button>
        <h3>仓库</h3>
        <div id="wareList"></div>
    </div>
</div>

<div class="panel-wrap" id="attrPanel">
    <div class="panel-content">
        <button class="panel-close">关闭</button>
        <h3>个人属性</h3>
        <div id="attrText"></div>
    </div>
</div>

<div class="panel-wrap" id="equipPanel">
    <div class="panel-content">
        <button class="panel-close">关闭</button>
        <h3>已穿戴装备</h3>
        <div id="wearList"></div>
    </div>
</div>

<div class="panel-wrap" id="settingPanel">
    <div class="panel-content">
        <button class="panel-close">关闭</button>
        <h3>设置</h3>
        <br>
        <button id="logoutBtn">退出账号</button>
    </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/view.js"></script>
<script src="./js/login.js"></script>
<script src="./js/gameCore.js"></script>
<script src="./js/draw.js"></script>
<script src="./js/bag.js"></script>
<script src="./js/uiPanel.js"></script>
<script src="./js/typingGame.js"></script>
</body>
</html>
