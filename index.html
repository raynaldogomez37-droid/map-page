<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>轮滑资讯平台</title>
<style>
  :root {
    --primary: #2563EB;
    --primary-dark: #1D4ED8;
    --bg: #F0F4F8;
    --card: #FFFFFF;
    --text: #1A202C;
    --muted: #718096;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 28px 16px 40px;
    text-align: center;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  header p {
    margin: 6px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }
  .container {
    max-width: 640px;
    margin: -24px auto 0;
    padding: 0 16px 40px;
  }
  .search-box {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-box svg { flex-shrink: 0; color: var(--muted); }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 8px 0;
    background: transparent;
    color: var(--text);
  }
  .search-box button {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .search-box button:active { background: var(--primary-dark); }

  .section-title {
    margin: 26px 0 12px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: "";
    width: 4px; height: 16px;
    background: var(--primary);
    border-radius: 2px;
    display: inline-block;
  }

  #memberResults { display: none; }
  #memberResults.show { display: block; }

  .member-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    cursor: pointer;
  }
  .member-card:active { background: #F7FAFC; }
  .member-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .member-head .name {
    font-size: 15px;
    font-weight: 700;
    word-break: break-all;
    line-height: 1.5;
  }
  .member-more {
    font-size: 12px;
    color: var(--primary);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .member-bio { font-size: 13px; color: #4A5568; line-height: 1.5; margin-bottom: 8px; }
  .member-photos { display: flex; gap: 6px; flex-wrap: wrap; }
  .member-photos img {
    width: 64px; height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #E2E8F0;
  }
  .no-result { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }

  .news-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .news-item:active { background: #F7FAFC; }
  .news-item .news-title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-new {
    background: #E53E3E;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .news-time { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .empty-tip { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }

  .modal-mask {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 18px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-box img.cover {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 12px;
    display: block;
  }
  .member-modal-photos {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .member-modal-photos img {
    width: 100%;
    border-radius: 10px;
    object-fit: cover;
    display: block;
  }
  .modal-box h2 { margin: 0 0 6px; font-size: 18px; }
  .modal-box .modal-time { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .modal-box .modal-content { font-size: 14px; line-height: 1.7; color: #2D3748; white-space: pre-wrap; }
  .modal-box .modal-link {
    display: inline-block;
    margin-top: 16px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .modal-close {
    display: block;
    margin: 18px auto 0;
    background: #EDF2F7;
    color: #4A5568;
    border: none;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }

/* ---------- 赛事与资讯搜索 ---------- */
.news-search{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.ns-box{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #D6DCE6;border-radius:12px;padding:8px 10px;color:#2563EB}
.ns-box:focus-within{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.ns-box input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:#222;min-width:0}
.ns-clear{display:none;width:18px;height:18px;border-radius:9px;background:#BDBDBD;color:#fff;font-size:13px;line-height:18px;text-align:center;cursor:pointer}
.ns-open{white-space:nowrap;font-size:13px;color:#555;display:flex;align-items:center;gap:4px;cursor:pointer}
.ns-count{font-size:12px;color:#888;margin:0 2px 8px;min-height:14px}
.ns-count b{color:#2563EB}
  .nt{flex:1;min-width:0}
mark{background:#FFEB3B;color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>

<header>
  <h1>轮滑资讯平台</h1>
  <p>成员查询 · 赛事与资讯</p>
</header>

<div class="container">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="searchInput" type="text" placeholder="输入姓名或证件号查询成员" />
    <button onclick="doSearch()">查询</button>
  </div>

  <div id="memberResults">
    <div class="section-title">查询结果 <span id="searchCountdown" style="font-size:11px;color:var(--muted);font-weight:400;"></span></div>
    <div id="memberList"></div>
  </div>

  <div class="section-title">赛事与资讯</div>
  <div class="news-search">
    <div class="ns-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="newsSearch" type="text" placeholder="搜索地区、项目、关键字，如：广州、广州比赛" />
      <span id="newsClear" class="ns-clear" title="清空">×</span>
    </div>
    <label class="ns-open"><input type="checkbox" id="onlyOpen"> 只看未结束</label>
  </div>
  <div id="newsCount" class="ns-count"></div>
  <div id="newsList"><div class="empty-tip">加载中...</div></div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const SUPABASE_URL = "https://akbkupgqscgzokwjnllr.supabase.co";
const SUPABASE_KEY = "sb_publishable_rnKCzXAh4OL1DIDIrTUf4A_JLnjfbWr";

async function callRpc(fn, params) {
  const resp = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(params || {})
  });
  if (!resp.ok) throw new Error("请求失败：" + resp.status);
  return await resp.json();
}

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function startSearchCountdown(seconds) {
  const wrap = document.getElementById("memberResults");
  const label = document.getElementById("searchCountdown");
  if (window.__searchCountdownTimer) clearInterval(window.__searchCountdownTimer);
  let left = seconds;
  const render = () => {
    const m = Math.floor(left / 60), s = left % 60;
    label.textContent = "（" + m + ":" + String(s).padStart(2, "0") + " 后自动收起）";
  };
  render();
  window.__searchCountdownTimer = setInterval(function() {
    left--;
    if (left <= 0) {
      clearInterval(window.__searchCountdownTimer);
      wrap.classList.remove("show");
      label.textContent = "";
      return;
    }
    render();
  }, 1000);
}

let memberCache = [];

async function doSearch() {
  const kw = document.getElementById("searchInput").value.trim();
  const wrap = document.getElementById("memberResults");
  const list = document.getElementById("memberList");
  if (!kw) { wrap.classList.remove("show"); return; }
  wrap.classList.add("show");
  list.innerHTML = '<div class="no-result">查询中...</div>';
  try {
    const members = await callRpc("search_roster_members", { p_keyword: kw });
    memberCache = members || [];
    if (memberCache.length === 0) {
      list.innerHTML = '<div class="no-result">没有找到匹配的成员</div>';
    } else {
      list.innerHTML = memberCache.map((m, idx) => {
        return '<div class="member-card" onclick="openMember(' + idx + ')">'
          + '<div class="member-head">'
          + '<span class="name">' + escapeHtml(m.name) + (m.id_card ? '　' + escapeHtml(m.id_card) : '') + '</span>'
          + '<span class="member-more">点击查看详情 →</span>'
          + '</div>'
          + '</div>';
      }).join("");
    }
    // 查询完输入框清空，结果显示2分钟倒计时后自动收起
    document.getElementById("searchInput").value = "";
    startSearchCountdown(120);
  } catch (e) {
    list.innerHTML = '<div class="no-result">查询失败，请稍后重试</div>';
  }
}
document.getElementById("searchInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSearch();
});

let newsCache = [];
let newsView = [];   // 当前显示的（搜索筛选后的）

async function loadNews() {
  const box = document.getElementById("newsList");
  try {
    let items;
    try {
      items = await callRpc("get_public_news_v2", {});   // 带隐藏的定位标签、起止日期（只用来搜索，不显示）
    } catch (e) {
      items = await callRpc("get_public_news", {});
    }
    newsCache = items || [];
    renderNews();
  } catch (e) {
    box.innerHTML = '<div class="empty-tip">加载失败，请刷新页面重试</div>';
  }
}

// 搜索用的"没有实际意义"的词：输入"广州比赛"时，去掉"比赛"只按"广州"找
const GENERIC_WORDS = ["比赛", "赛事", "活动", "资讯", "消息", "通知", "的", "有", "什么", "最近", "近期"];

function splitTags(t) {
  return (t || "").split(/[、,，;；\s\/|]+/).map(x => x.trim()).filter(Boolean);
}

/** 一个关键词是否命中这条资讯：标题、正文、隐藏标签包含它；或者它包含某个标签（如"广州比赛"包含"广州"） */
function tokenHit(it, tok) {
  const tags = splitTags(it.tags);
  const hay = ((it.title || "") + " " + (it.content || "") + " " + (it.tags || "")).toLowerCase();
  const t = tok.toLowerCase();
  if (hay.indexOf(t) >= 0) return true;
  if (tags.some(tag => tag.length >= 2 && t.indexOf(tag.toLowerCase()) >= 0)) return true;
  let core = tok;
  GENERIC_WORDS.forEach(w => { core = core.split(w).join(""); });
  core = core.trim().toLowerCase();
  if (core.length > 0 && core !== t && hay.indexOf(core) >= 0) return true;
  // "10月""2026-10"这类：落在资讯的起止日期里也算
  const mm = tok.match(/^(?:(\d{4})[-年.\/])?(\d{1,2})月?$/);
  if (mm && (it.start_date || it.end_date)) {
    const y = mm[1] ? parseInt(mm[1]) : new Date().getFullYear();
    const m = parseInt(mm[2]);
    if (m >= 1 && m <= 12) {
      const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
      const s = it.start_date ? new Date(it.start_date) : new Date(it.end_date);
      const e = it.end_date ? new Date(it.end_date) : s;
      if (s <= last && e >= first) return true;
    }
  }
  return false;
}

function isOpen(it) {   // 还没结束：没填结束日期，或者结束日期还没过
  if (!it.end_date) return true;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return new Date(it.end_date + "T00:00:00") >= today;
}

function highlight(text, toks) {
  let html = escapeHtml(text);
  toks.forEach(t => {
    if (!t) return;
    const safe = escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    html = html.replace(new RegExp(safe, "gi"), m => "<mark>" + m + "</mark>");
  });
  return html;
}

function renderNews() {
  const box = document.getElementById("newsList");
  const kw = document.getElementById("newsSearch").value.trim();
  const onlyOpen = document.getElementById("onlyOpen").checked;
  document.getElementById("newsClear").style.display = kw ? "inline-block" : "none";
  const toks = kw.split(/[\s,，、]+/).filter(Boolean);
  newsView = newsCache.filter(it => (!onlyOpen || isOpen(it)) && toks.every(t => tokenHit(it, t)));
  const countEl = document.getElementById("newsCount");
  if (kw || onlyOpen) {
    countEl.innerHTML = newsView.length ? '找到 <b>' + newsView.length + '</b> 条' : '';
  } else {
    countEl.innerHTML = '';
  }
  if (newsCache.length === 0) {
    box.innerHTML = '<div class="empty-tip">暂时没有最新资讯</div>';
    return;
  }
  if (newsView.length === 0) {
    box.innerHTML = '<div class="empty-tip">没有找到“' + escapeHtml(kw) + '”相关的赛事和资讯，换个关键字试试</div>';
    return;
  }
  const now = Date.now();
  const NEW_WINDOW_MS = 24 * 60 * 60 * 1000; // 发布后 24 小时内显示"新"
  const hiToks = toks.map(t => { let c = t; GENERIC_WORDS.forEach(w => { c = c.split(w).join(""); }); return c || t; });
  box.innerHTML = newsView.map((it, idx) => {
    const isNew = (now - new Date(it.published_at).getTime()) < NEW_WINDOW_MS;
    return '<div class="news-item" onclick="openNews(' + idx + ')">'
      + '<div class="news-title">' + (isNew ? '<span class="badge-new">新</span>' : '') + '<span class="nt">' + (kw ? highlight(it.title, hiToks) : escapeHtml(it.title)) + '</span></div>'
      + '<div class="news-time">' + formatTime(it.published_at) + '</div>'
      + '</div>';
  }).join("");
}

document.getElementById("newsSearch").addEventListener("input", renderNews);
document.getElementById("onlyOpen").addEventListener("change", renderNews);
document.getElementById("newsClear").addEventListener("click", function() {
  document.getElementById("newsSearch").value = "";
  renderNews();
});

function openNews(idx) {
  const it = newsView[idx];
  if (!it) return;
  const box = document.getElementById("modalBox");
  box.innerHTML = (it.cover_image ? '<img class="cover" src="' + it.cover_image + '">' : '')
    + '<h2>' + escapeHtml(it.title) + '</h2>'
    + '<div class="modal-time">' + formatTime(it.published_at) + '</div>'
    + '<div class="modal-content">' + escapeHtml(it.content || "") + '</div>'
    + (it.link_url ? '<a class="modal-link" href="' + normalizeUrl(it.link_url) + '" target="_blank" rel="noopener">查看相关链接 →</a>' : '')
    + '<button class="modal-close" onclick="closeNews()">关闭</button>';
  document.getElementById("modalMask").classList.add("show");
}
function closeNews() {
  document.getElementById("modalMask").classList.remove("show");
}
document.getElementById("modalMask").addEventListener("click", function(e) {
  if (e.target === this) closeNews();
});

function normalizeUrl(url) {
  if (!url) return "";
  url = url.trim();
  if (/^https?:\/\//i.test(url)) return url;
  return "https://" + url;
}

function openMember(idx) {
  const m = memberCache[idx];
  if (!m) return;
  const photos = (m.photos || []).filter(Boolean);
  const box = document.getElementById("modalBox");
  box.innerHTML = '<h2>' + escapeHtml(m.name) + (m.age ? '　' + m.age + '岁' : '') + '</h2>'
    + (m.id_card ? '<div class="modal-time">证件号：' + escapeHtml(m.id_card) + '</div>' : '')
    + '<div class="modal-content">' + escapeHtml(m.bio || "暂无简介") + '</div>'
    + (photos.length > 0
        ? '<div class="member-modal-photos">' + photos.map(p => '<img src="' + p + '">').join("") + '</div>'
        : '')
    + '<button class="modal-close" onclick="closeNews()">关闭</button>';
  document.getElementById("modalMask").classList.add("show");
}

loadNews();
</script>
</body>
</html>
