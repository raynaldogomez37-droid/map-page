<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>修仙游戏</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    background:#000000;
    width:100%;
    height:100%;
}
.hide-view{display:none !important;}

/* -------- 启动闪屏 -------- */
#viewSplash{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}
.splash-inner{
    text-align:center;
    width:100%;
}
.logo{
    width: min(75vw,320px);
    height:auto;
}
.tip-splash{
    color:#aaaaaa;
    margin-top:28px;
    font-size:15px;
}
.btn-manual{
    margin-top:40px;
    padding:12px 30px;
    background:#222;
    color:#fff;
    border:1px solid #555;
    border-radius:8px;
    font-size:16px;
    display:none;
}

/* -------- 登录页面 -------- */
#viewLogin{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
}
.login-box{
    width:100%;
    max-width:420px;
    background:#ffffff;
    color:#000000;
    border-radius:14px;
    padding:32px 24px;
    border:1px solid #cccccc;
    box-shadow: 0 0 25px #222222;
}
.login-box h2{
    text-align:center;
    margin-bottom:28px;
    font-size:24px;
    color:#000;
}
.tip {color:#555; margin:10px 0;font-size:14px}
.error {color:#dc2626}
input {
    width:100%;
    padding:12px 14px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #bbb;
    background:#f7f7f7;
    color:#000;
    font-size:16px;
}
button {
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
}
button:disabled {background:#888;opacity:0.7;cursor:not-allowed;}
button.danger {background:#b91c1c}
button.gold {background:#d97706}

/* -------- 游戏页面 -------- */
#viewGame{
    max-width:600px;
    margin:0 auto;
    padding:16px;
}
.box {
    background:#ffffff;
    color:#000000;
    padding:18px;
    border-radius:12px;
    margin-bottom:14px;
    border:1px solid #cccccc;
}
.box h3{
    color:#000;
    margin-bottom:8px;
}
.item-card {
    background:#eeeeee;
    color:#000000;
    padding:10px;
    border-radius:8px;
    margin:8px 0;
}
.rarity-common {border-left:4px solid #777777}
.rarity-rare {border-left:4px solid #4cc9f0}
.rarity-epic {border-left:4px solid #7209b7}
.rarity-legend {border-left:4px solid #f77f00}
</style>
</head>
<body>

<!-- 【1】启动闪屏界面 -->
<div id="viewSplash">
    <div class="splash-inner">
        <img class="logo" src="https://cdn.harmony5.cn/square/5c5a222b-2dd3-4ef0-8c7c-bdd10afce405.jpg" alt="游戏logo">
        <div class="tip-splash">正在启动游戏...</div>
        <button id="btnManual" class="btn-manual">点击进入游戏</button>
    </div>
</div>

<!-- 【2】登录注册界面 -->
<div id="viewLogin" class="hide-view">
    <div class="login-box">
        <h2>修仙游戏</h2>
        <input id="uname" placeholder="用户名">
        <input id="pwd" type="password" placeholder="密码">
        <div class="tip" id="authTip"></div>
        <button id="btnRegister">注册账号</button>
        <button id="btnLogin">登录账号</button>
    </div>
</div>

<!-- 【3】游戏主界面 -->
<div id="viewGame" class="hide-view">
    <div class="box">
        <h3>角色信息</h3>
        <p>角色名：<span id="roleName">-</span></p>
        <p>金币：<span id="goldNum">0</span></p>
        <button class="danger" id="btnLogout">退出登录（切换账号）</button>
    </div>
    <div class="box">
        <h3>秘境抽装备（消耗10金币）</h3>
        <div class="tip" id="drawTip"></div>
        <button class="gold" id="btnDraw">开始抽装备</button>
        <div id="drawResult"></div>
    </div>
    <div class="box">
        <h3>我的背包</h3>
        <div class="tip" id="bagTip"></div>
        <button id="btnLoadBag">刷新背包</button>
        <div id="bagList"></div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://akbkupgqscgzokwjnllr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rnKCzXAh4OL1DIDIrTUf4A_JLnjfbWr";

// DOM元素
const viewSplash = document.getElementById('viewSplash');
const viewLogin = document.getElementById('viewLogin');
const viewGame = document.getElementById('viewGame');
const btnManual = document.getElementById('btnManual');

const unameEl = document.getElementById('uname');
const pwdEl = document.getElementById('pwd');
const authTip = document.getElementById('authTip');

const roleNameEl = document.getElementById('roleName');
const goldNumEl = document.getElementById('goldNum');
const btnDraw = document.getElementById('btnDraw');
const drawResult = document.getElementById('drawResult');
const drawTip = document.getElementById('drawTip');
const btnLoadBag = document.getElementById('btnLoadBag');
const bagList = document.getElementById('bagList');
const bagTip = document.getElementById('bagTip');

let myUserId = sessionStorage.getItem("game_user_id") || null;
let isLoading = false;

// 页面视图切换函数（哈希模式，不会404）
function setView(mode){
    viewSplash.classList.add('hide-view');
    viewLogin.classList.add('hide-view');
    viewGame.classList.add('hide-view');
    if(mode === 'splash') viewSplash.classList.remove('hide-view');
    if(mode === 'login') viewLogin.classList.remove('hide-view');
    if(mode === 'game') viewGame.classList.remove('hide-view');
}

// 启动页定时器
let timerJump = null;
let timerShowBtn = null;

function splashEnd(){
    clearTimeout(timerJump);
    clearTimeout(timerShowBtn);
    // 如果已经登录 → 直接进游戏；没登录进登录页
    if(myUserId){
        setView("game");
        enterGame(myUserId);
    }else{
        setView("login");
    }
}

btnManual.onclick = splashEnd;

timerJump = setTimeout(splashEnd,5000);
timerShowBtn = setTimeout(()=>{
    btnManual.style.display="inline-block";
},8000);

// -------- 注册 --------
document.getElementById("btnRegister").onclick = async function(){
    if(isLoading){authTip.innerText="正在注册，请稍候...";return;}
    const username = unameEl.value.trim();
    const password = pwdEl.value.trim();
    if(!username||!password){authTip.innerText="请填写用户名密码";return;}
    isLoading = true;
    authTip.innerText="正在注册中...";
    authTip.classList.remove("error");
    this.disabled = true;
    try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/accounts`,{
            method:"POST",
            headers:{
                "apikey":SUPABASE_ANON_KEY,
                "Content-Type":"application/json",
                "Prefer":"return=representation"
            },
            body:JSON.stringify([{username,password}])
        });
        const data = await res.json();
        if(res.ok){
            authTip.innerText="注册成功，请登录";
        }else{
            authTip.innerText="注册失败："+JSON.stringify(data);
            authTip.classList.add("error");
        }
    }catch(err){
        authTip.innerText="网络异常，请检查网络";
        authTip.classList.add("error");
        console.error(err);
    }finally{
        isLoading = false;
        this.disabled = false;
    }
}

// -------- 登录 --------
document.getElementById("btnLogin").onclick = async function(){
    if(isLoading){authTip.innerText="正在登录，请稍候...";return;}
    const username = unameEl.value.trim();
    const password = pwdEl.value.trim();
    if(!username||!password){authTip.innerText="请填写用户名密码";return;}
    isLoading = true;
    authTip.innerText="正在登录中...";
    authTip.classList.remove("error");
    this.disabled = true;
    try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/accounts?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}`,{
            method:"GET",
            headers:{"apikey":SUPABASE_ANON_KEY}
        });
        const arr = await res.json();
        if(arr.length===0){
            authTip.innerText="用户名或密码错误";
            authTip.classList.add("error");
            return;
        }
        const user = arr[0];
        myUserId = user.id;
        sessionStorage.setItem("game_user_id", myUserId);
        setView("game");
        await enterGame(myUserId);
    }catch(err){
        authTip.innerText="网络异常，请检查网络";
        authTip.classList.add("error");
        console.error("登录网络错误：",err);
    }finally{
        isLoading = false;
        this.disabled = false;
    }
}

// -------- 退出登录 --------
document.getElementById("btnLogout").onclick = function(){
    myUserId = null;
    sessionStorage.removeItem("game_user_id");
    unameEl.value="";
    pwdEl.value="";
    authTip.innerText="";
    authTip.classList.remove("error");
    setView("login");
}

// -------- 加载游戏角色 --------
async function enterGame(accountId){
    roleNameEl.innerText = "加载中...";
    goldNumEl.innerText = "加载中...";
    drawResult.innerHTML = "";
    bagList.innerHTML = "";
    bagTip.innerText="正在加载角色数据，请稍候...";
    bagTip.classList.remove("error");
    try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${encodeURIComponent(accountId)}`,{
            headers:{"apikey":SUPABASE_ANON_KEY}
        });
        const playerArr = await res.json();
        let player;
        if(playerArr.length===0){
            const randName = "修仙者"+Math.floor(Math.random()*99999);
            await fetch(`${SUPABASE_URL}/rest/v1/users`,{
                method:"POST",
                headers:{
                    "apikey":SUPABASE_ANON_KEY,
                    "Content-Type":"application/json",
                    "Prefer":"return=representation"
                },
                body:JSON.stringify([{id:accountId,name:randName,gold:100}])
            })
            player = {name:randName,gold:100};
        }else{
            player = playerArr[0];
        }
        roleNameEl.innerText = player.name;
        goldNumEl.innerText = player.gold;
        await loadBag(accountId);
    }catch(err){
        bagTip.innerText="角色加载失败，请刷新页面！网络或者接口异常";
        bagTip.classList.add("error");
        console.error("角色加载错误",err);
        roleNameEl.innerText = "异常";
        goldNumEl.innerText = "异常";
    }
}

// -------- 抽卡 --------
btnDraw.onclick = async function(){
    if(isLoading){drawTip.innerText="正在抽卡，请稍候...";return;}
    if(!myUserId){drawTip.innerText="请先登录";return;}
    isLoading = true;
    drawTip.innerText="扣金币，抽取装备中...";
    drawTip.classList.remove("error");
    this.disabled = true;
    try{
        const r1 = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${encodeURIComponent(myUserId)}`,{headers:{"apikey":SUPABASE_ANON_KEY}});
        const pArr = await r1.json();
        const p = pArr[0];
        if(p.gold <10){
            drawResult.innerHTML="<p>金币不足！</p>";
            drawTip.innerText="";
            return;
        }
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${encodeURIComponent(myUserId)}`,{
            method:"PATCH",
            headers:{
                "apikey":SUPABASE_ANON_KEY,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({gold:p.gold-10})
        })
        const rnd = Math.random();
        let item,rarityClass;
        if(rnd<0.5){
            item = {item_name:"普通铁剑",item_data:{lv:1,atk:5},rarity:"common",user_id:myUserId};
            rarityClass="rarity-common";
        }else if(rnd<0.8){
            item = {item_name:"灵木法杖",item_data:{lv:2,atk:12},rarity:"rare",user_id:myUserId};
            rarityClass="rarity-rare";
        }else if(rnd<0.95){
            item = {item_name:"紫电宝甲",item_data:{lv:3,def:20},rarity:"epic",user_id:myUserId};
            rarityClass="rarity-epic";
        }else{
            item = {item_name:"九霄仙剑",item_data:{lv:5,atk:55},rarity:"legend",user_id:myUserId};
            rarityClass="rarity-legend";
        }
        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/items`,{
            method:"POST",
            headers:{
                "apikey":SUPABASE_ANON_KEY,
                "Content-Type":"application/json"
            },
            body:JSON.stringify([item])
        });
        const respText = await insertRes.text();
        if(!insertRes.ok){
            let errInfo = respText.trim() ? JSON.parse(respText) : "服务器无返回";
            throw new Error("装备写入失败："+JSON.stringify(errInfo));
        }
        drawResult.innerHTML = `<div class="item-card ${rarityClass}"><p>抽到：${item.item_name}</p></div>`;
        goldNumEl.innerText = p.gold-10;
        drawTip.innerText="抽卡成功！";
        await loadBag(myUserId);
    }catch(err){
        drawTip.innerText="抽卡异常："+err.message;
        drawTip.classList.add("error");
        console.error("抽卡错误",err);
    }finally{
        isLoading = false;
        this.disabled = false;
        setTimeout(()=>drawTip.classList.remove("error"),2500);
    }
}

// -------- 背包 --------
async function loadBag(uid){
    bagTip.innerText="正在读取背包...";
    bagTip.classList.remove("error");
    bagList.innerHTML = "";
    try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/items?user_id=eq.${encodeURIComponent(uid)}&order=created_at.desc`,{
            headers:{"apikey":SUPABASE_ANON_KEY}
        });
        const bag = await res.json();
        if(!bag||bag.length===0){
            bagList.innerHTML="<p>背包空空如也，快去抽装备</p>";
            bagTip.innerText="背包加载完成";
            return;
        }
        let html = "";
        bag.forEach(it=>{
            let cls = "rarity-common";
            if(it.rarity==="rare")cls="rarity-rare";
            if(it.rarity==="epic")cls="rarity-epic";
            if(it.rarity==="legend")cls="rarity-legend";
            html += `<div class="item-card ${cls}">
                <div>${it.item_name}</div>
                <div>等级:${it.item_data.lv} 攻击:${it.item_data.atk||0} 防御:${it.item_data.def||0}</div>
            </div>`;
        })
        bagList.innerHTML = html;
        bagTip.innerText="背包加载完成";
    }catch(err){
        bagTip.innerText="背包加载失败，请点刷新背包";
        bagTip.classList.add("error");
        console.error("背包加载错误",err);
    }
}

btnLoadBag.onclick = async function(){
    if(isLoading){bagTip.innerText="正在刷新，请稍候";return;}
    isLoading = true;
    this.disabled = true;
    await loadBag(myUserId);
    isLoading = false;
    this.disabled = false;
}
</script>
</body>
</html>
