<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>修仙游戏</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    background:#000000;
    width:100%;
    height:100%;
    overflow:hidden;
}
.splash-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    width:100%;
}
.logo{
    width: min(75vw,320px);
    height:auto;
}
.tip{
    color:#aaaaaa;
    margin-top:28px;
    font-size:15px;
}
.jump-btn{
    margin-top:40px;
    padding:12px 30px;
    background:#222;
    color:#fff;
    border:1px solid #555;
    border-radius:8px;
    font-size:16px;
    display:none;
}
</style>
</head>
<body>
<div class="splash-wrap">
    <img class="logo" src="https://cdn.harmony5.cn/square/5c5a222b-2dd3-4ef0-8c7c-bdd10afce405.jpg" alt="游戏logo">
    <div class="tip">正在启动游戏...</div>
    <button id="manualBtn" class="jump-btn" onclick="goLogin()">点击进入游戏</button>
</div>
<script>
// 自动读取当前网站域名，不用手动写死，避免填错域名404
function goLogin(){
    clearTimeout(timer);
    clearTimeout(showBtnTimer);
    // origin = 当前网站根域名，拼接页面文件名
    let target = window.location.origin + window.location.pathname.replace("index.html","login.html");
    window.location.href = target;
}

let timer = setTimeout(function(){
    goLogin();
},5000);

let showBtnTimer = setTimeout(function(){
    document.getElementById('manualBtn').style.display = 'inline-block';
},8000);

window.onbeforeunload=()=>{
    clearTimeout(timer);
    clearTimeout(showBtnTimer);
};
</script>
</body>
</html>
