<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase手机测试</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{padding:16px;font-family:system-ui;background:#111;color:#eee;}
        h2{margin-bottom:24px;font-size:22px;}
        button{
            width:100%;
            padding:16px;
            font-size:18px;
            margin:8px 0;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:#fff;
        }
        pre{
            margin-top:16px;
            padding:12px;
            background:#222;
            border-radius:8px;
            white-space:pre-wrap;
            font-size:14px;
            min-height:220px;
        }
    </style>
</head>
<body>
<h2>数据库读写测试</h2>
<div>
    <button onclick="addUser()">新增测试用户</button>
    <button onclick="listUser()">读取全部用户</button>

    <button onclick="addItem()">新增测试道具</button>
    <button onclick="listItem()">读取全部道具</button>

    <pre id="out">输出结果会显示在这里</pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://akbkupgqscgzokwjnllr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rnKCzXAh4OL1DIDIrTUf4A_JLnjfbWr";

const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const outDom = document.getElementById("out");

function log(txt){
    outDom.innerText = txt;
    console.log(txt);
}

async function addUser(){
  try{
    log("正在提交新增用户...");
    const {data,err}=await supabase.from("users").insert([{
        name:"测试玩家"+Date.now(),
        gold:10
    }]).select();
    log(JSON.stringify({data,err},null,2));
  }catch(e){
    log("捕获异常："+e.message);
  }
}

async function listUser(){
  try{
    log("正在读取用户...");
    const {data,err}=await supabase.from("users").select("*");
    log(JSON.stringify({data,err},null,2));
  }catch(e){
    log("捕获异常："+e.message);
  }
}

async function addItem(){
  try{
    log("正在提交新增道具...");
    const {data,err}=await supabase.from("items").insert([{
        user_id:null,
        item_name:"测试宝剑",
        item_data:{level:1,attr:"锋利"}
    }]).select();
    log(JSON.stringify({data,err},null,2));
  }catch(e){
    log("捕获异常："+e.message);
  }
}

async function listItem(){
  try{
    log("正在读取道具...");
    const {data,err}=await supabase.from("items").select("*");
    log(JSON.stringify({data,err},null,2));
  }catch(e){
    log("捕获异常："+e.message);
  }
}
</script>
</body>
</html>
